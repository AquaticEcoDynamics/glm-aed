# This is a basic workflow to build GLM

name: Compile Mac, Ubuntu, Windows

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains jobs for macOS, Ubuntu and Windows
  ubuntu24:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Checkout submodules
        run: git submodule update --init --recursive

      # Runs a single command using the runners shell
      - name: Getting packages
        run:  |
          sudo apt-get update -y
          sudo apt-get install libnetcdf-dev
          sudo apt-get install libgd3
          sudo apt-get install libgd-dev
          sudo apt-get install gfortran
          sudo apt-get install devscripts
          sudo apt-get install debhelper

      # Runs a set of commands using the runners shell
      - name: compile GLM
        run: | 
           cd $GITHUB_WORKSPACE/glm-source
           chmod u+x ./admin/make_release_info.sh
           ./build_glm.sh
           mkdir -p $GITHUB_WORKSPACE/binaries/ubuntu/24.04
           cp -r $GITHUB_WORKSPACE/glm-source/binaries/ubuntu/24.04/* $GITHUB_WORKSPACE/binaries/ubuntu/24.04/.
 
      - name: update binaries and push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          git add -A
          git commit -m "Update Ubuntu 24.04 binaries"
          git push

  ubuntu26:
    # The type of runner that the job will run on
    runs-on: ubuntu-26.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Checkout submodules
        run: git submodule update --init --recursive

      # Runs a single command using the runners shell
      - name: Getting packages
        run:  |
          sudo apt-get update -y
          sudo apt-get install libnetcdf-dev
          sudo apt-get install libgd3
          sudo apt-get install libgd-dev
          sudo apt-get install gfortran
          sudo apt-get install devscripts
          sudo apt-get install debhelper

      # Runs a set of commands using the runners shell
      - name: compile GLM
        run: | 
           cd $GITHUB_WORKSPACE/glm-source
           chmod u+x ./admin/make_release_info.sh
           ./build_glm.sh
           mkdir -p $GITHUB_WORKSPACE/binaries/ubuntu/26.04
           cp -r $GITHUB_WORKSPACE/glm-source/binaries/ubuntu/26.04/* $GITHUB_WORKSPACE/binaries/ubuntu/26.04/.
 
      - name: update binaries and push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          git add -A
          git commit -m "Update Ubuntu 26.04 binaries"
          git push

  macOS-15:
    # The type of runner that the job will run on
    runs-on: macos-15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
 
      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install packages
        run: |
          brew reinstall gcc
          brew install netcdf
          brew install gd

      - name: compile GLM
        run: |
          cd $GITHUB_WORKSPACE/glm-source
          ./build_glm.sh
          MOSDIR=`grep 'SOFTWARE LICENSE AGREEMENT FOR ' '/System/Library/CoreServices/Setup Assistant.app/Contents/Resources/en.lproj/OSXSoftwareLicense.rtf' | awk -F 'macOS ' '{print $NF}' | tr -d '\\' | tr ' ' '_'`
          mkdir -p $GITHUB_WORKSPACE/binaries/macos/${MOSDIR}
          cp -r $GITHUB_WORKSPACE/glm-source/binaries/macos/${MOSDIR}/* $GITHUB_WORKSPACE/binaries/macos/${MOSDIR}/.
 
      - name: run GLM FCR
        shell: bash
        run: | 
          cd glm-examples/FCR
          MOSDIR=`grep 'SOFTWARE LICENSE AGREEMENT FOR ' '/System/Library/CoreServices/Setup Assistant.app/Contents/Resources/en.lproj/OSXSoftwareLicense.rtf' | awk -F 'macOS ' '{print $NF}' | tr -d '\\' | tr ' ' '_'`
          echo now try running glm for ${MOSDIR}
          $GITHUB_WORKSPACE/binaries/macos/${MOSDIR}/glm_latest/glm
          echo run completed

      - name: update binaries and push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          git add -A
          git commit -m "Update MacOS binaries"
          git push


  macOS-S:
    # The type of runner that the job will run on
    runs-on: macos-26
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
 
      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install packages
        run: |
          brew reinstall gcc
          brew install netcdf
          brew install gd

      - name: compile GLM
        run: |
          cd $GITHUB_WORKSPACE/glm-source
          ./build_glm.sh
          MOSDIR=`grep 'SOFTWARE LICENSE AGREEMENT FOR ' '/System/Library/CoreServices/Setup Assistant.app/Contents/Resources/en.lproj/OSXSoftwareLicense.rtf' | awk -F 'macOS ' '{print $NF}' | tr -d '\\' | tr ' ' '_'`
          mkdir -p $GITHUB_WORKSPACE/binaries/macos/${MOSDIR}
          cp -r $GITHUB_WORKSPACE/glm-source/binaries/macos/${MOSDIR}/* $GITHUB_WORKSPACE/binaries/macos/${MOSDIR}/.
 
      - name: run GLM FCR
        shell: bash
        run: | 
          cd glm-examples/FCR
          MOSDIR=`grep 'SOFTWARE LICENSE AGREEMENT FOR ' '/System/Library/CoreServices/Setup Assistant.app/Contents/Resources/en.lproj/OSXSoftwareLicense.rtf' | awk -F 'macOS ' '{print $NF}' | tr -d '\\' | tr ' ' '_'`
          echo now try running glm for ${MOSDIR}
          $GITHUB_WORKSPACE/binaries/macos/${MOSDIR}/glm_latest/glm
          echo run completed

      - name: update binaries and push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          git add -A
          git commit -m "Update MacOS binaries"
          git push

  windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Install packages
        run: |
          choco install make
          choco install mingw
          choco install git
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: compile GLM
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/glm-source
          ./build_glm.sh
          mkdir -p $GITHUB_WORKSPACE/binaries/windows
          cd $GITHUB_WORKSPACE/glm-source/binaries/windows
          cp -r * $GITHUB_WORKSPACE/binaries/windows

      - name: run GLM FCR
        shell: bash
        run: | 
          cd glm-examples/FCR
          echo now try running glm
          $GITHUB_WORKSPACE/binaries/windows/glm_latest/glm.exe
          echo run completed

      - name: update binaries and push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          git add -A
          git commit -m "Update Windows binaries"
          git push
